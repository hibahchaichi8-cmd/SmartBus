server.port=${SERVER_PORT:8082}
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27019/smartbus_transport}
spring.data.mongodb.auto-index-creation=true
server.error.include-message=never
server.forward-headers-strategy=none
app.auth-url=${AUTH_URL:http://localhost:8081}
app.transport-url=${TRANSPORT_URL:http://localhost:8082}
app.trip-url=${TRIP_URL:http://localhost:8083}
app.internal-token=${INTERNAL_TOKEN}
app.seed=${SEED_DATA:true}
# Service discovery
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
spring.application.name=transport-service
# Central configuration
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}