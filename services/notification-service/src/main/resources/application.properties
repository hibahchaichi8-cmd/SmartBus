spring.application.name=notification-service

server.port=${SERVER_PORT:8085}

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27019/smartbus_notification}
spring.data.mongodb.auto-index-creation=true

server.error.include-message=never
server.error.include-stacktrace=never

app.auth-url=${AUTH_URL:http://localhost:8081}
app.internal-token=${INTERNAL_TOKEN}
app.trip-url=${TRIP_URL:http://localhost:8083}
app.ticket-url=${TICKET_URL:http://localhost:8084}

app.notification-poll-ms=15000
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}